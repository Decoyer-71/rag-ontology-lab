# 한빛텔레콤 골든셋 (golden_set.yaml)
#
# ⚠⚠ 합성 데이터입니다. (CLAUDE.md §3-S)
#
# 교본 RAG STEP 1 — **만들기 전에 채점표부터 만든다.**
# 교본 부록 01 형식을 따릅니다.
#
# ⚠⚠ split 규율 (CLAUDE.md §5-E')
#   dev     : 튜닝하며 봐도 되는 문항
#   holdout : **단계가 닫힐 때만** 연다. 여기로 튜닝하면 그 수치는 낙관 편향이다
#
# type 분류
#   단일사실 : 한 청크 안에 답이 있다
#   비교종합 : 여러 청크를 합쳐야 답이 된다  ← 반드시 섞는다 (교본 STEP 1)
#   코드조회 : 요금제코드·조항번호 등 글자 일치가 필요하다  ← 벡터 검색이 약한 유형
#   용어     : 사내 약어 때문에 검색이 빗나간다  ← Stage 6 개념사전이 고친다
#   관계     : 문서에 문장으로 없다. 그래프를 걸어야 한다  ← Stage 7
#   부재     : ⚠ 문서에 답이 없다. **B형 실패**. 「확인되지 않습니다」가 정답이다

questions:
  # ── 단일사실 ───────────────────────────────────────────────────────────
  - id: G-001
    q: "국제전화 요금은 어떻게 부과되나요?"
    must_cite: ["TERMS-2026#제21조"]
    gold: "기본료에 포함되지 않고 별도 요율표에 따라 부과된다. 사전 이용 신청이 필요하다."
    type: 단일사실
    split: dev

  - id: G-002
    q: "청약철회는 며칠 안에 해야 하나요?"
    must_cite: ["TERMS-2026#제12조"]
    gold: "계약 체결일로부터 14일 이내. 단말기를 개통해 사용한 경우 개통일로부터 7일 이내."
    type: 단일사실
    split: dev

  - id: G-003
    q: "미납하면 언제 정지되나요?"
    must_cite: ["FAQ-BILL"]
    gold: "기한 경과 15일 후 발신정지, 45일 후 수신정지, 90일 경과 시 직권 해지될 수 있다."
    type: 단일사실
    split: dev

  - id: G-004
    q: "통신장애 보상은 얼마나 받나요?"
    must_cite: ["OUTAGE#2"]
    gold: "연속 3시간 또는 월 누적 6시간 이상 중단 시 중단 시간 요금의 6배를 자동 감면한다."
    type: 단일사실
    split: dev

  - id: G-005
    q: "eSIM은 대리점에서 개통할 수 있나요?"
    must_cite: ["DEV-COMPAT", "STORE"]
    gold: "불가능하다. eSIM 개통은 온라인으로만 처리된다."
    type: 단일사실
    split: holdout

  - id: G-006
    q: "분실 안심 서비스는 언제까지 가입할 수 있나요?"
    must_cite: ["ADDON"]
    gold: "단말기 개통일로부터 30일 이내에만 가입할 수 있다."
    type: 단일사실
    split: holdout

  # ── 코드조회 (⚠ 벡터 검색이 약한 유형. Stage 4 BM25 가 고친다) ──────────
  - id: G-010
    q: "5G-STD-69 요금제의 기본 데이터는 얼마인가요?"
    must_cite: ["PLANS-2026"]
    gold: "110GB (2026년 기준). 소진 후 5Mbps 속도제어."
    type: 코드조회
    split: dev
    note: "⚠ 구버전 PLANS-2025 를 인용하면 100GB 로 틀린 답이 나온다 — 유효일자 필터 필요"

  - id: G-011
    q: "LTE-S-33 은 어떤 요금제인가요?"
    must_cite: ["PLANS-2026"]
    gold: "LTE세이브. 월 33,000원, 6GB, 음성 200분. 2026년부터 신규 가입 중단."
    type: 코드조회
    split: dev

  - id: G-012
    q: "약관 제33조는 무슨 내용인가요?"
    must_cite: ["TERMS-2026#제33조"]
    gold: "할인반환금 — 약정 만료 전 해지 시 잔여 기간에 비례해 할인액 일부를 반환한다."
    type: 코드조회
    split: holdout

  # ── 비교종합 (⚠ 여러 청크 필요. 교본 STEP 1 — 어려운 유형을 반드시 섞는다) ──
  - id: G-020
    q: "작년 대비 5G스탠다드의 데이터 제공량이 늘었나요?"
    must_cite: ["PLANS-2026", "PLANS-2025"]
    gold: "늘었다. 100GB에서 110GB로 확대되었다."
    type: 비교종합
    split: dev

  - id: G-021
    q: "3회선 가족결합을 하면 한 달에 얼마를 아끼나요?"
    must_cite: ["BUNDLE"]
    gold: "회선당 8,800원씩 3회선이므로 월 26,400원."
    type: 비교종합
    split: dev

  - id: G-022
    q: "가입 10개월 차에 해지하면 할인반환금이 얼마나 나오나요?"
    must_cite: ["PEN-RULE#2", "TERMS-2026#제33조"]
    gold: "6~12개월 구간이므로 받은 할인액의 60%를 반환한다."
    type: 비교종합
    split: dev

  - id: G-023
    q: "단말기 할부금이 남았는데 해지하면 위약금이랑 같이 내야 하나요?"
    must_cite: ["FAQ-DEV", "PEN-RULE"]
    gold: "할부금과 할인반환금은 별개다. 할부금은 일시 납부하거나 기존 방식으로 계속 납부한다."
    type: 비교종합
    split: holdout

  - id: G-024
    q: "명의를 바꾸면 위약금이 나오나요?"
    must_cite: ["MAN-XFER#2"]
    gold: "나오지 않는다. 약정 기간이 승계되므로 할인반환금이 발생하지 않는다."
    type: 비교종합
    split: holdout

  # ── 용어 (⚠ 사내 약어. Stage 6 개념사전이 고친다) ────────────────────────
  - id: G-030
    q: "3망 해지하면 W코드는 어떻게 되나요?"
    must_cite: ["MAN-TERM#3", "PEN-RULE#3"]
    gold: "3망 해지는 일괄해지를 뜻하며 W09(일괄해지 합산 반환금)가 적용된다. 팀장 승인이 필요하다."
    type: 용어
    split: dev
    note: "⚠⚠ 「3망 해지」·「W코드」는 어느 문서에도 정의가 없다. 개념사전 없이는 검색이 빗나간다"

  - id: G-031
    q: "환불받으려면 어떻게 하나요?"
    must_cite: ["FAQ-BILL", "TERMS-2026#제12조"]
    gold: "과오납금은 고객센터 접수 후 3영업일 이내 처리. 청약철회에 의한 반환은 별도 조건이 있다."
    type: 용어
    split: dev
    note: "⚠ 고객은 「환불」이라 하고 약관은 「청약철회」라 한다 — 동의어 연결이 없으면 못 찾는다"

  - id: G-032
    q: "선약 걸면 위약금 얼마나 나와요?"
    must_cite: ["PEN-RULE"]
    gold: "선택약정(요금할인 25%) 해지 시 W01이 적용되며 경과 기간별 반환 비율에 따른다."
    type: 용어
    split: holdout
    note: "⚠ 「선약」은 사내 축약어다"

  - id: G-033
    q: "정지랑 해지가 같은 건가요?"
    must_cite: ["GLOSS"]
    gold: "다르다. 정지는 일시적으로 사용 불가로 만드는 것이고 해지는 계약 종료다."
    type: 용어
    split: dev

  # ── 관계 (⚠⚠ 문서에 문장으로 없다. Stage 7 그래프가 필요하다) ────────────
  - id: G-040
    q: "제 폰에서 쓸 수 있는 더 싼 요금제가 있나요? (고객: 김민수)"
    must_cite: []
    gold: "5G슬림(월 55,000원). 갤럭시S25와 호환되고 데이터는 110GB로 동일하며 월 14,000원 절감된다."
    type: 관계
    split: dev
    note: "⚠⚠ 3홉이다 — 고객→보유 단말기→호환 요금제→현재 요금제와 비교. RAG로는 원리적으로 못 푼다"

  - id: G-041
    q: "박준호 고객에게 5G 요금제를 추천해도 되나요?"
    must_cite: []
    gold: "안 된다. 보유 단말기 갤럭시J7은 3G/LTE만 지원하므로 5G 요금제에 가입할 수 없다."
    type: 관계
    split: dev
    note: "⚠ Stage 8 RULE:NO_5G_PLAN_ON_NON5G_DEVICE 의 검사 대상이기도 하다"

  - id: G-042
    q: "5G슬림에서 데이터세이프에 가입할 수 있나요?"
    must_cite: ["ADDON"]
    gold: "불가능하다. 데이터세이프는 5G프리미엄과 5G스탠다드에서만 가입할 수 있다."
    type: 관계
    split: holdout

  # ── 부재 (⚠⚠ B형 실패. 「확인되지 않습니다」가 정답이다) ─────────────────
  - id: G-050
    q: "해외 로밍 요금은 국가별로 얼마인가요?"
    must_cite: []
    gold: "확인되지 않습니다. 이 문서 집합에는 로밍 요율 정보가 없습니다."
    type: 부재
    split: dev
    note: "⚠⚠ B형 — 문서를 만들어야 한다. RAG로는 못 고친다 (교본 STEP 7)"

  - id: G-051
    q: "이번 달 제 청구액이 왜 늘었나요?"
    must_cite: ["FAQ-BILL"]
    gold: "일반적 원인은 안내할 수 있으나 개인 청구 내역은 조회가 필요합니다 — 도구 호출의 몫입니다."
    type: 부재
    split: dev
    note: "⚠ 교본 §0 두 번째 관문 — 계산·개인 실시간 데이터는 RAG가 아니라 API 호출"

  - id: G-052
    q: "한빛텔레콤의 2026년 매출은 얼마인가요?"
    must_cite: []
    gold: "확인되지 않습니다. 이 문서 집합의 범위를 벗어납니다."
    type: 부재
    split: holdout
