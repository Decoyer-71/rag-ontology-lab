[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ⚠ 미구현 단계는 NotImplementedError 로 실패한다. 그게 정상이다.
#   -q 로 짧게 보고, 실패 원인은 --tb=short 로 충분하다.
addopts = -q --tb=short --strict-markers

markers =
    stage0: Stage 0 — 채점표
    stage1: Stage 1 — 청킹
    stage2: Stage 2 — 임베딩 (TF-IDF)
    stage3: Stage 3 — 벡터 검색 (코사인)
    stage4: Stage 4 — BM25 · RRF · 메타데이터 필터
    stage5: Stage 5 — 평가 · A/B/C 분해
    breaks: ⚠ 「깨지는 조건」 테스트 — 언제 이 방법이 틀린 답을 내는가 (CLAUDE.md §10 원칙 3)
